spring.application.name=backend

# === Configuration PostgreSQL ===
# Les valeurs par défaut couvrent le dev local (hors Docker) ; docker-compose surcharge via variables d'env.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/roomops}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:roomops_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:roomops_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# === Configuration JPA/Hibernate ===
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# === Configuration du serveur ===
server.port=8080
server.servlet.context-path=/api/v1

# === Logging ===
logging.level.com.coworking.roomops=DEBUG
logging.level.org.springframework.security=DEBUG