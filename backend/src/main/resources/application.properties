spring.application.name=backend

# === Configuration PostgreSQL ===
# Les valeurs par défaut couvrent le dev local (hors Docker) ; docker-compose surcharge via variables d'env.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/roomops}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:roomops_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:roomops_password}
spring.datasource.driver-class-name=org.postgresql.Driver
# HikariCP attend 30s par défaut avant d'abandonner une tentative de connexion : sans ce délai
# réduit, une panne PostgreSQL mettrait 30s à être détectée par /actuator/health (même raison
# que le timeout Redis ci-dessous).
spring.datasource.hikari.connection-timeout=2000

# === Configuration JPA/Hibernate ===
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# === Configuration du serveur ===
server.port=8080
server.servlet.context-path=/api/v1

# === Logging ===
logging.level.com.coworking.roomops=DEBUG
logging.level.org.springframework.security=DEBUG

# === Sécurité JWT ===
# Clé HMAC-SHA256 encodée en base64 (32 octets). La valeur par défaut ci-dessous
# est UNIQUEMENT destinée au développement local et à la CI : elle est publique
# (committée dans le repo) et ne doit jamais être utilisée dans un environnement
# réellement exposé. Surcharger via la variable d'environnement JWT_SECRET.
roomops.security.jwt.secret=${JWT_SECRET:dwlr18CVc9Fv5XYAy7XY1h93alLRHn91HUfD13DbKd8c=}
roomops.security.jwt.access-token-ttl-ms=${JWT_ACCESS_TOKEN_TTL_MS:900000}
roomops.security.jwt.refresh-token-ttl-ms=${JWT_REFRESH_TOKEN_TTL_MS:604800000}

# === Redis (liste de révocation de tokens pour le droit à l'oubli) ===
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
# Lettuce attend 60s par défaut avant d'abandonner une commande : sans ce délai réduit, une
# panne Redis mettrait une minute à être détectée par /actuator/health (et par tout appel
# passant par TokenRevocationService), au lieu d'échouer rapidement comme un healthcheck l'exige.
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms

# === CORS ===
# Liste séparée par des virgules. Par défaut, seule l'origine du serveur de dev Angular
# (ng serve) est autorisée ; à surcharger via CORS_ALLOWED_ORIGINS dans tout autre environnement.
# Sans objet en production derrière le nginx de docker-compose.prod.yml (cf. DEPLOYMENT.md) :
# le navigateur y appelle l'API en same-origin, aucune requête cross-origin n'est émise.
roomops.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# === Actuator (healthcheck du conteneur Docker) ===
# Seul /health est exposé : les autres endpoints (env, beans, threaddump...) exposeraient des
# détails internes sur un chemin volontairement en permitAll (cf. SecurityConfig), donc public.
management.endpoints.web.exposure.include=health