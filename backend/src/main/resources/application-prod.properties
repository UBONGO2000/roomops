spring.config.activate.on-profile=prod

# Production requires every connection and security value to be supplied by the environment.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Never fall back to the public development signing key in production.
roomops.security.jwt.secret=${JWT_SECRET}
roomops.security.jwt.reject-development-secret=true
roomops.security.jwt.access-token-ttl-ms=${JWT_ACCESS_TOKEN_TTL_MS:900000}
roomops.security.jwt.refresh-token-ttl-ms=${JWT_REFRESH_TOKEN_TTL_MS:604800000}
roomops.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

logging.level.com.coworking.roomops=INFO
logging.level.org.springframework.security=INFO
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health
spring.flyway.placeholders.production=true
