name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: roomops
          POSTGRES_USER: roomops_user
          POSTGRES_PASSWORD: roomops_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roomops_user -d roomops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Ensure mvnw is executable
        # Le bit d'exécution se perd facilement quand mvnw est committé depuis un poste
        # Windows (pas de notion native de permissions Unix). Filet de sécurité pour
        # éviter de re-casser la CI si ça se reproduit après un futur commit.
        run: chmod +x backend/mvnw

      - name: Build and test (backend)
        working-directory: backend
        run: ./mvnw -B verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco

      - name: Build backend Docker image
        run: docker build -t roomops-backend:ci -f backend/Dockerfile .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check formatting (prettier)
        working-directory: frontend
        run: npx prettier --check "src/**/*.{ts,html,scss}"

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Build frontend Docker image
        run: docker build -t roomops-frontend:ci ./frontend
