server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # "backend" est le nom du service dans docker-compose.prod.yml, résolu par le DNS interne du
    # compose : ce bloc ne fonctionne que dans ce contexte, pas en `docker run` isolé. Pas de
    # segment de chemin après le host dans proxy_pass : l'URI reçue (/api/v1/...) est transmise
    # telle quelle, ce qui correspond exactement au server.servlet.context-path du backend.
    # Location la plus spécifique ("/api/") : nginx la fait toujours primer sur "/" ci-dessous,
    # quel que soit l'ordre déclaré dans ce fichier.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
