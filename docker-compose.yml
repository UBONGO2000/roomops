services:
  db:
    image: postgres:16-alpine
    container_name: roomops-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: roomops-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Pas de volume : le contenu (liste de révocation de tokens à TTL court) est
    # jetable par conception, perdre le cache au redémarrage n'est pas un problème.

  backend:
    build:
      # Contexte = racine du repo : le Dockerfile a besoin de api-contract/openapi.yaml
      # (sibling de backend/) pour la génération de code OpenAPI.
      context: .
      dockerfile: backend/Dockerfile
    container_name: roomops-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: roomops-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
